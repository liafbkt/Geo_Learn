name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

env:
  CI: 'true'
  RUSTUP_TOOLCHAIN: '1.98.0'
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: ${{ matrix.os }} quality gates
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Install pinned package manager
        run: npm install --global pnpm@11.19.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Install Chromium
        run: pnpm exec playwright install chromium
      - name: QG-01
        run: pnpm lint
      - name: QG-02
        run: pnpm typecheck
      - name: QG-03
        run: pnpm test -- --run --coverage
      - name: QG-04
        run: pnpm exec playwright test
      - name: QG-05
        run: pnpm build
      - name: QG-06
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: QG-07
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: QG-08
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: QG-09
        run: pnpm content:validate -- --all
